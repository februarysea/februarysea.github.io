name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # 16:00 UTC = 00:00 Asia/Shanghai the next day. GitHub may queue scheduled runs.
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      sync_enode:
        description: Fetch Enode data (also works before enabling the daily schedule)
        type: boolean
        default: true
      sync_codex:
        description: Refresh the primary Codex login and extend the archived usage history
        type: boolean
        default: true
      sync_p7:
        description: Fetch P7 observations (requires p7-auth Secrets; disabled until verified)
        type: boolean
        default: false
      dry_run:
        description: Validate and build only; do not deploy or save the checkpoint
        type: boolean
        default: true
      force_audit:
        description: Recheck all training details in the saved coverage
        type: boolean
        default: false
      accept_deletions:
        description: Accept missing records immediately, including bulk deletions (review first)
        type: boolean
        default: false

permissions:
  contents: read

# Keep deployment and its checkpoint together; newer pushes must not cancel them.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    name: Training sync
    if: github.ref == 'refs/heads/master' && (vars.ENODE_SYNC_ENABLED == 'true' || inputs.sync_enode == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      state_revision: ${{ steps.state.outputs.state_revision }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test sync and disclosure checks
        run: |
          python3 -m unittest discover -s tests -p 'test_enode*.py'
          python3 -m unittest discover -s scripts -p 'test_sync_status.py'

      - name: Load last successfully deployed state
        id: state
        run: >-
          python3 scripts/enode_state_store.py load
          --bootstrap config/enode-sync-bootstrap.json
          --output "$RUNNER_TEMP/enode-previous.json"

      # No package installation or site build runs in the credential-bearing job.
      # Secrets are individual values, available only to this step.
      - name: Fetch and validate incremental training data
        id: collect
        env:
          ENODE_SESSION_TOKEN: ${{ secrets.ENODE_SESSION_TOKEN }}
          ENODE_API_KEY: ${{ secrets.ENODE_API_KEY }}
          ENODE_DEVICE_ID: ${{ secrets.ENODE_DEVICE_ID }}
          ENODE_DEVICE_NAME: ${{ secrets.ENODE_DEVICE_NAME }}
          ENODE_PRIVATE_DIR: ${{ runner.temp }}/enode-private
          FORCE_AUDIT: ${{ inputs.force_audit }}
          ACCEPT_DELETIONS: ${{ inputs.accept_deletions }}
        shell: bash
        run: |
          flags=()
          if [[ "$FORCE_AUDIT" == "true" ]]; then flags+=(--force-audit); fi
          if [[ "$ACCEPT_DELETIONS" == "true" ]]; then flags+=(--accept-deletions); fi
          python3 scripts/enode_sync.py sync \
            --state "$RUNNER_TEMP/enode-previous.json" \
            --catalog config/enode-catalog.json \
            --output-dir "$RUNNER_TEMP/enode-output" "${flags[@]}"

      - name: Upload allowlisted data only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enode-sync
          path: |
            ${{ runner.temp }}/enode-output/training.json
            ${{ runner.temp }}/enode-output/sync-state.json
          if-no-files-found: error
          retention-days: 7

  sync-codex:
    name: Codex Token sync
    if: >-
      github.repository == 'februarysea/februarysea.github.io' &&
      github.ref == 'refs/heads/master' &&
      (vars.CODEX_SYNC_ENABLED == 'true' || inputs.sync_codex == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: codex-auth
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test collection, renewal, and disclosure checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_codex*.py'
          python3 -m unittest discover -s scripts -p 'test_sync_status.py'

      - name: Install verified official Codex client
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/codex-bin"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-x86_64-unknown-linux-musl.tar.gz \
            -o "$RUNNER_TEMP/codex.tar.gz"
          echo "86f268d81b898f3e144c5ecff2ad2fda2c5802e042d6195b72538fe0fa125057  $RUNNER_TEMP/codex.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/codex.tar.gz" -C "$RUNNER_TEMP/codex-bin" codex-x86_64-unknown-linux-musl
          mv "$RUNNER_TEMP/codex-bin/codex-x86_64-unknown-linux-musl" "$RUNNER_TEMP/codex-bin/codex"
          echo "$RUNNER_TEMP/codex-bin" >> "$GITHUB_PATH"

      - name: Mint token for encrypted credential storage
        id: auth_token
        env:
          APP_ID: ${{ vars.CODEX_APP_ID }}
          APP_INSTALLATION_ID: ${{ vars.CODEX_APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
        run: python3 scripts/codex_github.py auth

      - name: Renew primary login and extend archived statistics
        id: collect
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_ACCOUNT_ID: ${{ secrets.CODEX_ACCOUNT_ID }}
          CODEX_ACCOUNT_COUNT: '1'
          GH_TOKEN: ${{ steps.auth_token.outputs.token }}
        run: >-
          python3 scripts/collect_codex_usage.py
          --archive config/codex-usage-archive.json
          --previous src/data/codex-profile.json
          --output "$RUNNER_TEMP/codex-output/codex-profile.json"

      - name: Upload only validated public statistics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-usage
          path: ${{ runner.temp }}/codex-output/codex-profile.json
          if-no-files-found: error
          retention-days: 3

      - name: Revoke credential-storage token
        if: always() && steps.auth_token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.auth_token.outputs.token }}
        run: python3 scripts/codex_github.py revoke

  sync-p7:
    name: Pets P7 sync
    if: >-
      github.repository == 'februarysea/februarysea.github.io' &&
      github.ref == 'refs/heads/master' &&
      (vars.P7_SYNC_ENABLED == 'true' || inputs.sync_p7 == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: p7-auth
    outputs:
      state_revision: ${{ steps.state.outputs.state_revision }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test filtering, authentication, and disclosure checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_p7*.py'
          python3 -m unittest discover -s scripts -p 'test_sync_status.py'

      - name: Load last successfully deployed P7 state
        id: state
        run: >-
          python3 scripts/p7_state_store.py load
          --bootstrap config/p7-sync-bootstrap.json
          --output "$RUNNER_TEMP/p7-previous.json"

      # Reuse the verified session; no unverified refresh or login endpoint.
      # A confirmed expiry fails this job with a sign-in summary/annotation.
      # GitHub failure email requires the account's Actions Email setting.
      - name: Read and filter P7 history
        id: collect
        env:
          P7_APP_PROFILE_JSON: ${{ secrets.P7_APP_PROFILE_JSON }}
          P7_SESSION_JSON: ${{ secrets.P7_SESSION_JSON }}
          P7_DEVICE_ID: ${{ secrets.P7_DEVICE_ID }}
        run: >-
          python3 scripts/p7_sync.py sync
          --state "$RUNNER_TEMP/p7-previous.json"
          --output-dir "$RUNNER_TEMP/p7-output"

      - name: Upload allowlisted P7 statistics only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p7-sync
          path: |
            ${{ runner.temp }}/p7-output/p7-summary.json
            ${{ runner.temp }}/p7-output/sync-state.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [sync, sync-codex, sync-p7]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/master' &&
      (needs.sync.result == 'success' || needs.sync.result == 'skipped') &&
      (needs.sync-codex.result == 'success' || needs.sync-codex.result == 'skipped') &&
      (needs.sync-p7.result == 'success' || needs.sync-p7.result == 'skipped') &&
      (github.event_name != 'schedule' || vars.ENODE_SYNC_ENABLED == 'true' || vars.CODEX_SYNC_ENABLED == 'true' || vars.P7_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download validated training data
        if: needs.sync.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enode-sync
          path: ${{ runner.temp }}/enode-output

      - name: Apply validated training data
        if: needs.sync.result == 'success'
        run: |
          python3 scripts/enode_sync.py validate \
            --state "$RUNNER_TEMP/enode-output/sync-state.json" \
            --public "$RUNNER_TEMP/enode-output/training.json"
          cp "$RUNNER_TEMP/enode-output/training.json" src/data/training.json

      - name: Download validated Codex statistics
        if: needs.sync-codex.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-usage
          path: ${{ runner.temp }}/codex-output

      - name: Apply validated Codex statistics
        if: needs.sync-codex.result == 'success'
        run: |
          python3 scripts/codex_usage.py "$RUNNER_TEMP/codex-output/codex-profile.json" --previous src/data/codex-profile.json
          cp "$RUNNER_TEMP/codex-output/codex-profile.json" src/data/codex-profile.json

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9

      - name: Download validated P7 statistics
        if: needs.sync-p7.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p7-sync
          path: ${{ runner.temp }}/p7-output

      - name: Apply validated P7 statistics
        if: needs.sync-p7.result == 'success'
        run: |
          python3 scripts/p7_sync.py validate \
            --state "$RUNNER_TEMP/p7-output/sync-state.json" \
            --public "$RUNNER_TEMP/p7-output/p7-summary.json" \
            --previous src/data/p7-summary.json
          cp "$RUNNER_TEMP/p7-output/p7-summary.json" src/data/p7-summary.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update workout-motion library
        id: workout_motion
        continue-on-error: true
        timeout-minutes: 2
        run: |
          motion_source="$(mktemp -d "$RUNNER_TEMP/workout-motion.XXXXXX")"
          git clone --depth 1 --branch main https://github.com/februarysea/workout-motion.git "$motion_source"
          motion_revision="$(git -C "$motion_source" rev-parse HEAD)"
          node scripts/sync-workout-motion.mjs --source "$motion_source" --revision "$motion_revision"
          echo "workout-motion revision: $motion_revision" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep bundled motions if library update fails
        if: steps.workout_motion.outcome == 'failure'
        run: |
          git restore --worktree -- vendor/workout-motion public/exercises/workout-motion
          git clean -fd -- vendor/workout-motion public/exercises/workout-motion
          echo "::warning::workout-motion update failed; using the bundled library."

      - name: Validate and build
        run: |
          pnpm run eslint
          pnpm run check
          node --test tests/training.test.mjs tests/exercise-motion.test.mjs
          pnpm run usage:test
          pnpm run usage:validate
          python3 -m unittest discover -s scripts -p 'test_p7*.py'
          python3 -m unittest discover -s scripts -p 'test_sync_status.py'
          python3 scripts/p7_sync.py validate --public src/data/p7-summary.json
          node --test scripts/test-pet-weight.mjs
          pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    needs: [sync, sync-codex, sync-p7, build]
    # always() also permits normal deploys while the rollout flag skips sync.
    if: always() && !cancelled() && needs.build.result == 'success' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  persist:
    needs: [sync, deploy]
    if: always() && !cancelled() && needs.sync.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download successfully deployed data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enode-sync
          path: ${{ runner.temp }}/enode-output

      - name: Save checkpoint on enode-data branch
        env:
          EXPECTED_REVISION: ${{ needs.sync.outputs.state_revision }}
        run: >-
          python3 scripts/enode_state_store.py persist
          --directory "$RUNNER_TEMP/enode-output"
          --expected-revision "$EXPECTED_REVISION"

  persist-codex:
    needs: [sync-codex, deploy]
    if: always() && !cancelled() && needs.sync-codex.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-usage
          path: ${{ runner.temp }}/codex-output

      # The same snapshot has already been deployed. GITHUB_TOKEN does not
      # trigger another push workflow, so saving it cannot create a run loop.
      - name: Save deployed statistics on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/persist_codex_usage.py "$RUNNER_TEMP/codex-output/codex-profile.json"

  persist-p7:
    needs: [sync-p7, deploy]
    if: always() && !cancelled() && needs.sync-p7.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download successfully deployed P7 data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p7-sync
          path: ${{ runner.temp }}/p7-output

      - name: Save checkpoint on p7-data branch
        env:
          EXPECTED_REVISION: ${{ needs.sync-p7.outputs.state_revision }}
        run: >-
          python3 scripts/p7_state_store.py persist
          --directory "$RUNNER_TEMP/p7-output"
          --expected-revision "$EXPECTED_REVISION"

      - name: Save deployed P7 statistics on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/persist_p7_summary.py "$RUNNER_TEMP/p7-output/p7-summary.json"
